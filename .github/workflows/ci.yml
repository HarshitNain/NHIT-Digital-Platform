name: NHIT Enterprise CI/CD Pipeline

'on':
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND: TypeScript Validation & Production Build
  # ----------------------------------------------------------------------------
  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: nhit-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: nhit-frontend/package-lock.json

      - name: Clean Deterministic Dependency Install
        run: npm ci

      - name: Run TypeScript Strict Typecheck (tsc -b)
        run: npx tsc -b

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Verify Dist Artifacts
        run: test -f dist/index.html && echo "Frontend build verified successfully!"

  # ----------------------------------------------------------------------------
  # 2. GO MICROSERVICES: Strict Module-Aware Compilation
  # ----------------------------------------------------------------------------
  go-microservices:
    name: Go Microservices Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: false

      - name: Verify Go Microservices Build (Zero Silent Failures)
        run: |
          set -e
          echo "Compiling all Go microservices..."
          FAILED=0
          services=(
            "NHIT Backend/services/auth-service"
            "NHIT Backend/services/user-service"
            "NHIT Backend/services/organization-service"
            "NHIT Backend/services/department-service"
            "NHIT Backend/services/designation-service"
            "NHIT Backend/services/project-service"
            "NHIT Backend/services/vendor-service"
            "NHIT Backend/services/api-gateway"
          )
          for svc in "${services[@]}"; do
            if [ -d "$svc" ]; then
              echo ">>> Building $svc..."
              if ! (cd "$svc" && go build ./...); then
                echo "❌ Build failed for $svc"
                FAILED=1
              fi
            fi
          done

          if [ -d "Nhit-Note" ]; then
            echo ">>> Building Nhit-Note module services..."
            if ! (cd "Nhit-Note" && go build ./services/...); then
              echo "❌ Build failed for Nhit-Note"
              FAILED=1
            fi
          fi

          if [ $FAILED -ne 0 ]; then
            echo "FATAL: One or more Go microservices failed compilation!"
            exit 1
          fi
          echo "All Go microservices compiled successfully!"

  # ----------------------------------------------------------------------------
  # 3. BACKEND & INTEGRATION TEST SUITE (Postgres 15 + Redis 7 + 117 Invariants)
  # ----------------------------------------------------------------------------
  backend-integration-tests:
    name: Full API, 2FA & Platform Invariant Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nhit_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r "NHIT Backend/requirements.txt"

      - name: Verify Python Syntax Across Workspace
        run: |
          python -m py_compile "NHIT Backend/gateway_swagger.py"
          python -m py_compile "NHIT Backend/scripts/harness.py"
          python -m py_compile "tests/run_ci_backend.py"
          python -m py_compile "tests/test_full_suite.py"

      - name: Migrate & Seed Test Database
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: nhit_db
          DB_USER: postgres
          DB_PASSWORD: password
          REDIS_URL: redis://127.0.0.1:6379/0
        run: |
          python "NHIT Backend/scripts/setup_test_db.py"

      - name: Execute Full Platform Invariant Harness (144+ Checks across 7 Phases)
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: nhit_db
          DB_USER: postgres
          DB_PASSWORD: password
          REDIS_URL: redis://127.0.0.1:6379/0
          ENVIRONMENT: test
        run: |
          python "NHIT Backend/scripts/harness.py" --fast --html harness/reports/harness_report.html --markdown harness/reports/harness_report.md

      - name: Launch Gateway & Execute Full Integration Test Suite
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_NAME: nhit_db
          DB_USER: postgres
          DB_PASSWORD: password
          REDIS_URL: redis://127.0.0.1:6379/0
          PORT: 8080
          ENVIRONMENT: test
          API_BASE_URL: http://127.0.0.1:8080/api/v1
        run: |
          set -o pipefail
          python -u tests/run_ci_backend.py 2>&1 | tee ci_backend.log

      - name: Publish Harness & Test Results to Job Summary
        if: always()
        run: |
          if [ -f harness/reports/harness_report.md ]; then
            cat harness/reports/harness_report.md >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "## 📊 Backend Integration & 2FA Test Suite Report" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -f ci_backend.log ]; then
            cat ci_backend.log >> $GITHUB_STEP_SUMMARY
          else
            echo "No log generated." >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Harness Verification Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-reports
          path: harness/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload Test Execution Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: ci_backend.log
          retention-days: 7
          if-no-files-found: ignore

  # ----------------------------------------------------------------------------
  # 4. MULTI-CHANNEL SUCCESS ALERTS (Email / Slack / Discord)
  # ----------------------------------------------------------------------------
  notify-success:
    name: Multi-Channel Success Alerts
    needs: [frontend-build, go-microservices, backend-integration-tests]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dispatch Multi-Channel Success Alerts (Email / Slack / Discord)
        continue-on-error: true
        env:
          WORKFLOW_NAME: "NHIT Enterprise CI/CD Pipeline"
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python .github/scripts/notify.py
