[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name         forward
    Listen       0.0.0.0
    Port         24224

[INPUT]
    Name         dummy
    Tag          security.heartbeat
    Dummy        {"event": "HEARTBEAT", "status": "ONLINE", "service": "fluent-bit-siem-shipper", "timestamp": "2026-10-19T21:40:00Z"}

# Filter to capture security events, rate limit breaches, 401 unauthenticated spikes, and 429 warnings
[FILTER]
    Name         grep
    Match        *
    Regex        log (SECURITY_ALERT|RATE_LIMIT_EXCEEDED|HTTP\/1\.1 429|HTTP\/1\.1 401|PASSWORD_CHANGE_REQUIRED)

# Central SIEM Standard Output (collected by CloudWatch, Datadog Agent, or Elastic Beats)
[OUTPUT]
    Name         stdout
    Match        *
    Format       json_lines
