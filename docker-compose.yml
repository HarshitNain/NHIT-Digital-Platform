version: '3.8'

# ==============================================================================
# NHIT DIGITAL PLATFORM - UNIFIED PRODUCTION DOCKER COMPOSE
# Orchestrates:
#   1. Reverse Proxy (Nginx on Port 80/443) -> Unified routing for UI & APIs
#   2. Frontend (React 18 / TypeScript SPA)
#   3. API Gateway (FastAPI / PyJWT / RBAC / Multi-Tenant Gateway)
#   4. Database (PostgreSQL 15 with automated migrations & seed)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. REVERSE PROXY: Unified Gateway on Port 80
  # ----------------------------------------------------------------------------
  reverse-proxy:
    image: nginx:alpine
    container_name: nhit-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - gateway
    networks:
      - nhit-network

  # ----------------------------------------------------------------------------
  # 2. FRONTEND: React 18 Single-Page Application
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./nhit-frontend
      dockerfile: Dockerfile
    container_name: nhit-frontend
    restart: always
    expose:
      - "80"
    ports:
      - "5173:80"  # Backwards compatibility with dev port
    networks:
      - nhit-network

  # ----------------------------------------------------------------------------
  # 3. BACKEND: Enterprise API Gateway & Swagger Documentation
  # ----------------------------------------------------------------------------
  gateway:
    build:
      context: ./NHIT Backend
      dockerfile: Dockerfile
    container_name: nhit-gateway
    restart: always
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=nhit_db
      - DB_USER=postgres
      - DB_PASSWORD=shristi
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-test-secret-key-for-development-only-change-in-production}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_SENDER=${EMAIL_SENDER:-NHIT Security <onboarding@resend.dev>}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-NHIT Enterprise Security}
      - RATE_LIMIT_AUTH_MAX=${RATE_LIMIT_AUTH_MAX:-5}
      - RATE_LIMIT_AUTH_WINDOW=${RATE_LIMIT_AUTH_WINDOW:-60}
      - RATE_LIMIT_PUBLIC_MAX=${RATE_LIMIT_PUBLIC_MAX:-60}
      - RATE_LIMIT_USER_MAX=${RATE_LIMIT_USER_MAX:-180}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-10}
    expose:
      - "8080"
    ports:
      - "127.0.0.1:8080:8080"  # Direct gateway restricted to localhost; external clients must use Nginx proxy
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nhit-network

  # ----------------------------------------------------------------------------
  # 4. DATABASE: PostgreSQL 15 with Automatic Migrations & Seeding
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: nhit-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: shristi
      POSTGRES_DB: nhit_db
    ports:
      - "127.0.0.1:5433:5432"  # Bound strictly to loopback interface 127.0.0.1 to prevent external network exposure
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./NHIT Backend/scripts/consolidated-migrations.sql:/docker-entrypoint-initdb.d/01-migrations.sql
      - ./NHIT Backend/scripts/fresh-seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nhit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nhit-network

  # ----------------------------------------------------------------------------
  # 5. SIEM & AUDIT: Fluent-Bit Centralized Log Shipper (OPEN-12)
  # ----------------------------------------------------------------------------
  fluent-bit:
    image: fluent/fluent-bit:3.0
    container_name: nhit-fluent-bit
    restart: always
    volumes:
      - ./fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
    ports:
      - "24224:24224"
    networks:
      - nhit-network

# ------------------------------------------------------------------------------
# VOLUMES & NETWORKS
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: nhit_postgres_data

networks:
  nhit-network:
    name: nhit-network
    driver: bridge
