user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Upstream Backend & Frontend Services
    upstream frontend_service {
        server frontend:80;
    }

    upstream gateway_service {
        server gateway:8080;
    }

    server {
        listen 80;
        server_name localhost;
        client_max_body_size 50M;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # ----------------------------------------------------------------------
        # 1. API GATEWAY & MICROSERVICES ROUTING (/api/v1/)
        # ----------------------------------------------------------------------
        location /api/v1/ {
            proxy_pass http://gateway_service/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # 2. INTERACTIVE SWAGGER & OPENAPI DOCUMENTATION (/swagger, /redoc, /docs)
        # ----------------------------------------------------------------------
        location /swagger {
            proxy_pass http://gateway_service/swagger;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass http://gateway_service/openapi.json;
            proxy_set_header Host $host;
        }

        location /redoc {
            proxy_pass http://gateway_service/redoc;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://gateway_service/docs;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------------------------
        # 3. GATEWAY HEALTHCHECK (/health)
        # ----------------------------------------------------------------------
        location /health {
            proxy_pass http://gateway_service/health;
            proxy_set_header Host $host;
        }

        # ----------------------------------------------------------------------
        # 4. REACT 18 SINGLE-PAGE APPLICATION (Frontend Root /)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_service/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
