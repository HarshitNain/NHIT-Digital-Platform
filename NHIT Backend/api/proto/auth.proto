syntax = "proto3";

option go_package = "github.com/ShristiRnr/NHIT_Backend/api/pb/authpb";

import "google/api/annotations.proto";

// ====================
// Auth / User Registration & Verification
// ====================

enum UserRole {
  USER_ROLE_UNSPECIFIED = 0;
  SUPER_ADMIN = 1;
}

enum SSOProvider {
  SSO_PROVIDER_UNSPECIFIED = 0;
  GOOGLE = 1;
  MICROSOFT = 2;
}

// Registration
message RegisterUserRequest {
  string tenant_id = 1;
  string name = 2;
  string email = 3;
  string password = 4;
  repeated string roles = 5;
}

message RegisterUserResponse {
  string user_id = 1;
  string name = 2;
  string email = 3;
  repeated string roles = 4;
  repeated string permissions = 5;
}

// Email Verification
message VerifyEmailRequest {
  string user_id = 1;
  string verification_token = 2; // Token sent via email
}

message VerifyEmailResponse {
  bool success = 1;
}

// Password Reset (forgot/reset)
message ForgotPasswordRequest {
  string email = 1;
  string tenant_id =2;
  optional string org_id =3;
}

message ForgotPasswordResponse {
  bool success = 1;
}

message ResetPasswordByTokenRequest {
  string otp = 1;
  string new_password = 2;
  string tenant_id = 3;
  optional string org_id = 4;
}

message ResetPasswordByTokenResponse {
  string message = 1;
  bool success = 2;
}

// OTP-based password reset request
message ForgotPasswordOTPRequest {
  string email = 1;
  string tenant_id = 2;
}

message ForgotPasswordOTPResponse {
  string message = 1;
  bool success = 2;
}

message VerifyOTPAndResetPasswordRequest {
  string email = 1;
  string tenant_id = 2;
  string otp = 3;
  string new_password = 4;
}

message VerifyOTPAndResetPasswordResponse {
  string message = 1;
  bool success = 2;
}

// Login / Logout
message UserLoginRequest {
  string login = 1;       // email or username
  string password = 2;
  string tenant_id = 3;
  string org_id = 4;
}

message UserLoginResponse {
  string token = 1;            // JWT
  string refresh_token = 2;
  string user_id = 3;
  string email = 4;
  string name = 5;
  repeated string roles = 6;
  repeated string permissions = 7;
  string last_login_at = 8;
  string last_login_ip = 9;
  string tenant_id = 10;
  string org_id = 11;
  int64 token_expires_at = 12;
  int64 refresh_expires_at = 13;
}

message UserLogoutRequest {
  string user_id = 1;
  string refresh_token = 2;
}

message UserLogoutResponse {
  bool success = 1;
}

message RefreshTokenRequest {
  string refresh_token = 1;
  string tenant_id = 2;
  string org_id = 3;
}

message RefreshTokenResponse {
  string token = 1;
  string refresh_token = 2;
  int64 token_expires_at = 3;
  int64 refresh_expires_at = 4;
  string session_id = 5;
  string user_id = 6;
  string email = 7;
  string name = 8;
  repeated string roles = 9;
  repeated string permissions = 10;
  string last_login_at = 11;
  string last_login_ip = 12;
  string tenant_id = 13;
  string org_id = 14;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string email = 3;
  string name = 4;
  string tenant_id = 5;
  string org_id = 6;
  repeated string roles = 7;
  repeated string permissions = 8;
  int64 expires_at = 9;
}

message InitiateSSORequest {
  string tenant_id = 1;
  string org_id = 2;
  SSOProvider provider = 3;
  string redirect_uri = 4;
  string state = 5;
}

message InitiateSSOResponse {
  string auth_url = 1;
  string state = 2;
}

message CompleteSSORequest {
  string tenant_id = 1;
  string org_id = 2;
  SSOProvider provider = 3;
  string code = 4;
  string state = 5;
  string redirect_uri = 6;
}

message InitiateSSOLogoutRequest {
  string tenant_id = 1;
  string org_id = 2;
  SSOProvider provider = 3;
  string id_token_hint = 4;
  string post_logout_redirect_uri = 5;
  string state = 6;
}

message InitiateSSOLogoutResponse {
  string logout_url = 1;
  string state = 2;
}

message CompleteSSOLogoutRequest {
  string tenant_id = 1;
  string org_id = 2;
  SSOProvider provider = 3;
  string state = 4;
}

message SendVerificationEmailRequest {
  string user_id = 1;
}

message SendVerificationEmailResponse {
  bool success = 1;
}

message SendPasswordResetEmailRequest {
  string email = 1;
}

message SendPasswordResetEmailResponse {
  bool success = 1;
}

// ====================
// Extend AuthService in gRPC
// ====================
service AuthService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
  }
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-email"
      body: "*"
    };
  }
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/forgot-password"
      body: "*"
    };
  }
  rpc ResetPasswordByToken(ResetPasswordByTokenRequest) returns (ResetPasswordByTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/reset-password"
      body: "*"
    };
  }
  rpc Login(UserLoginRequest) returns (UserLoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
  }
  rpc Logout(UserLogoutRequest) returns (UserLogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
  }
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
  }
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/validate-token"
      body: "*"
    };
  }
  rpc InitiateSSO(InitiateSSORequest) returns (InitiateSSOResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/sso/initiate"
      body: "*"
    };
  }
  rpc CompleteSSO(CompleteSSORequest) returns (UserLoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/sso/complete"
      body: "*"
    };
  }
  rpc InitiateSSOLogout(InitiateSSOLogoutRequest) returns (InitiateSSOLogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/sso/logout/initiate"
      body: "*"
    };
  }
  rpc CompleteSSOLogout(CompleteSSOLogoutRequest) returns (UserLogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/sso/logout/complete"
      body: "*"
    };
  }
  rpc SendVerificationEmail(SendVerificationEmailRequest) returns (SendVerificationEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/send-verification"
      body: "*"
    };
  }
  rpc SendPasswordResetEmail(SendPasswordResetEmailRequest) returns (SendPasswordResetEmailResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/send-reset-email"
      body: "*"
    };
  }
  rpc ForgotPasswordWithOTP(ForgotPasswordOTPRequest) returns (ForgotPasswordOTPResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/forgot-password-otp"
      body: "*"
    };
  }
  rpc VerifyOTPAndResetPassword(VerifyOTPAndResetPasswordRequest) returns (VerifyOTPAndResetPasswordResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/verify-otp-reset-password"
      body: "*"
    };
  }
  rpc SwitchOrganization(SwitchOrganizationRequest) returns (UserLoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/switch-organization"
      body: "*"
    };
  }
}

// ====================
// Organization Switching
// ====================
message SwitchOrganizationRequest {
  string org_id = 1;   // Optional - UUID of target organization
  string org_name = 2; // Optional - Name of target organization (e.g., "Sales Department")
  // At least one must be provided
}
